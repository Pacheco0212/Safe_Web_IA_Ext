<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial de Análisis - Safe Web IA</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; padding: 40px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h1 { color: #1976d2; margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; color: #7f8c8d; font-size: 12px; text-transform: uppercase; padding: 15px; border-bottom: 2px solid #eee; font-weight: 600; }
        td { padding: 15px; border-bottom: 1px solid #f9f9f9; font-size: 14px; vertical-align: middle; }
        
        /* Badges */
        .badge { padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 11px; letter-spacing: 0.5px; }
        .badge-safe { background: #e8f5e9; color: #2e7d32; }
        .badge-suspicious { background: #fff3e0; color: #ef6c00; }
        .badge-dangerous { background: #ffebee; color: #c62828; }

        .url-col { max-width: 350px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
        .url-col a { text-decoration: none; color: #2c3e50; transition: color 0.2s; }
        .url-col a:hover { color: #1976d2; text-decoration: underline; }

        /* --- BOTÓN VER MÁS (+) --- */
        .btn-toggle {
            background: none; border: none; cursor: pointer;
            color: #1976d2; font-weight: bold; font-size: 20px;
            transition: transform 0.3s ease, background-color 0.2s;
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-toggle:hover { background-color: #e3f2fd; }
        .btn-toggle.open { transform: rotate(45deg); color: #d32f2f; background-color: #ffebee; }

        /* --- FILA DE DETALLES (OCULTA) --- */
        .details-row { display: none; background-color: #fafafa; }
        .details-row.show { display: table-row; }
        
        .details-container {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            border-left: 4px solid #1976d2;
            margin: 10px 0 20px 10px;
        }

        .detail-box {
            background: white; border: 1px solid #eee;
            border-radius: 8px; padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .detail-box h4 { margin: 0 0 10px 0; font-size: 12px; color: #7f8c8d; text-transform: uppercase; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .detail-item { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
        .detail-label { color: #666; }
        .detail-val { font-weight: 600; color: #333; }
        
        tr.main-row:hover { background-color: #f8faff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Historial de Análisis IA</h1>
        <table id="history-table">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>URL</th>
                    <th>Veredicto IA</th>
                    <th>Confianza</th>
                    <th style="text-align: center;">Detalles</th> </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>
    <script src="history.js" type="module"></script>
</body>
</html>
